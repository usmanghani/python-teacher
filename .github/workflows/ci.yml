name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  unit:
    name: Unit tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:agent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: test-results/unit.xml
          if-no-files-found: ignore

  browser:
    name: Browser tests
    # Playwright 1.58 has no browser build for the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  gate:
    name: CI gate
    if: always()
    needs: [unit, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check
        env:
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          test "$UNIT" = success
          test "$BROWSER" = success
